        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            color: #555;
        }

            border: 2px solid #ddd;

            font-size: 1rem;
            background: #fff;
            appearance: none;

            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            background: #fafafa;
        }
        .object-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .object-header input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #8b1a1a;
        }
        .object-name {
            font-weight: 600;
            font-size: 0.95rem;
            flex: 1;
        }
        .unit-badge {
            background: #f0e6d3;
            color: #8b5e3c;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;

            display: none;

            padding-left: 26px;

            display: flex;

        }
        .field-row.note-row {

            margin-bottom: 0;
            white-space: nowrap;

            text-align: left;

        .note-input {

            min-width: 60px;
            padding: 6px 8px;
            border: 1.5px solid #ddd;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .note-input:focus { 
            border-color: #8b1a1a; 
            outline: none; 
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #8b1a1a;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;

        .btn:active { background: #6b1414; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .no-items { color: #999; text-align: center; padding: 20px; font-style: italic; }
        .radio-group { display: flex; flex-direction: column; gap: 10px; }
        .radio-label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #333;
            cursor: pointer;
            line-height: 1.4;

            height: 18px;
            accent-color: #8b1a1a;
            flex-shrink: 0;
            margin-top: 2px;

            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            background: #fff;

            color: #8b1a1a;
            background: #f0e6d3;

            font-weight: 700;
            color: #8b1a1a;

<body>
    <h1>🪔 Event Planner</h1>

    <div class="section">
        <label for="event-select">விழா தேர்வு செய்க</label>
        <select id="event-select">
            <option value="">— விழா —</option>
            <option value="wedding">திருமணம்</option>
            <option value="engagement">நிச்சயதார்த்தம்</option>
            <option value="gruhapravesam">கிருஹபிரவேசம்</option>
        </select>
    </div>

    <div class="section" id="details-section" style="display:none;">
        <div class="detail-row">
            <label for="input-name">பெயர்</label>
            <input type="text" id="input-name" class="detail-input" placeholder="பெயர் உள்ளிடவும்">
        </div>
        <div class="detail-row">
            <label for="input-phone">கைபேசி எண்</label>
            <input type="tel" id="input-phone" class="detail-input" placeholder="கைபேசி எண் உள்ளிடவும்">
        </div>
        <div class="detail-row">
            <label for="input-date">தேதி</label>
            <input type="date" id="input-date" class="detail-input">
        </div>
    </div>

    <div class="section" id="type-section" style="display:none;">
        <label>பொருட்கள் வகை தேர்வு செய்க</label>
        <div class="radio-group">
            <label class="radio-label">
                <input type="radio" name="purchase-type" value="contract" onchange="renderObjects()">
                வாத்தியார் பொருட்கள் வாங்க வேண்டும் (Contract)
            </label>
            <label class="radio-label">
                <input type="radio" name="purchase-type" value="nonContract" checked onchange="renderObjects()">
                விழா நடத்துனர் பொருட்கள் வாங்க வேண்டும் (Non-contract)
            </label>
        </div>
    </div>

    <div class="section" id="objects-section" style="display:none;">
        <label>தேவையான பூஜை பொருட்கள்</label>
        <div id="objects-list"></div>
    </div>

    <button class="btn" id="generate-btn" style="display:none;" onclick="generatePDF()">
        📄 PDFஆக தரவு செய்க
    </button>

    <div id="pdf-content">
        <div class="pdf-date" id="pdf-date"></div>
        <div class="pdf-symbol">உ</div>
        <div class="pdf-title" id="pdf-title"></div>
        <div id="pdf-meta"></div>
        <div id="pdf-table-body"></div>
    </div>

                    { id: "pasuveshti",    name: "பசுவிற்க்கு வேஷ்டி, டவல்",        unit: "செட்",    hasQuantity: true,  defaultQty: "1",   defaultNote: "" },
                    { id: "aiyarveshti",   name: "ஐயர் வேஷ்டி",                      unit: "எண்.",    hasQuantity: true,  defaultQty: "1",   defaultNote: "9 x 5" },

                    { id: "coconutpeel",   name: "தேங்காய் உரித்தது",                unit: "எண்.",    hasQuantity: true,  defaultQty: "2",   defaultNote: "" },
                    { id: "vazhaipazham",  name: "வாழை பழம்",                         unit: "டஜன்",   hasQuantity: true,  defaultQty: "1",   defaultNote: "" },
                    { id: "vazhaielai",    name: "வாழை இலை",                          unit: "எண்.",    hasQuantity: true,  defaultQty: "5",   defaultNote: "" },
                    { id: "kalasanool",    name: "கலச நூல் உருண்டை",                 unit: "எண்.",    hasQuantity: true,  defaultQty: "1",   defaultNote: "" },
                    { id: "maavilai",      name: "மாவிலை",                            unit: "கொத்து", hasQuantity: true,  defaultQty: "5",   defaultNote: "" },
                    { id: "nelpori",       name: "நெல் பொரி",                         unit: "பாக்கெட்", hasQuantity: true,  defaultQty: "1",   defaultNote: "" },
                    { id: "vellam",        name: "வெல்லம்",                           unit: "ரூ.",     hasQuantity: true,  defaultQty: "5",   defaultNote: "" },
                    { id: "navadhaniyam",  name: "நவதானியம்",                         unit: "கி. (ஒவ்வொன்றும்)", hasQuantity: true, defaultQty: "100", defaultNote: "" },
                    { id: "navagrahathuni", name: "நவகிரஹ துணி",                     unit: "செட்",    hasQuantity: true,  defaultQty: "1",   defaultNote: "" },
                    { id: "kopparai",      name: "கொப்பரை",                           unit: "எண்.",    hasQuantity: true,  defaultQty: "1",   defaultNote: "" },
                    { id: "pattuvasthiram", name: "சிகப்பு பட்டு வஸ்திரம்",         unit: "எண்.",    hasQuantity: true,  defaultQty: "1",   defaultNote: "" },
                    { id: "homathiraviyam", name: "ஹோம திரவியம்",                    unit: "பாக்கெட்", hasQuantity: true,  defaultQty: "1",   defaultNote: "" },
                    { id: "dharba",        name: "தர்பை",                             unit: "கட்டு",  hasQuantity: true,  defaultQty: "1",   defaultNote: "" },
                    { id: "thonnai",       name: "தொன்னை",                            unit: "எண்.",    hasQuantity: true,  defaultQty: "20",  defaultNote: "" },
                    { id: "teacups",       name: "Tea Cups",                          unit: "எண்.",    hasQuantity: true,  defaultQty: "10",  defaultNote: "" },
                ],
                nonContract: [
                    { id: "kuthuvilakku",  name: "குத்து விளக்கு / எண்ணெய் / திரி",          unit: "எண்.",   hasQuantity: true,  defaultQty: "2",  defaultNote: "" },
                    { id: "ammanvilakku",  name: "காமாட்சி அம்மன் விளக்கு / தீப் பெட்டி",    unit: "எண்.",   hasQuantity: true,  defaultQty: "1",  defaultNote: "" },
                    { id: "siriyathattu",  name: "சிறிய தட்டு",                               unit: "எண்.",   hasQuantity: true,  defaultQty: "2",  defaultNote: "" },
                    { id: "periyathattu",  name: "பெரிய தட்டு",                               unit: "எண்.",   hasQuantity: true,  defaultQty: "4",  defaultNote: "" },
                    { id: "neykinnam",     name: "நெய் கிண்ணம்",                             unit: "எண்.",   hasQuantity: true,  defaultQty: "1",  defaultNote: "" },
                    { id: "mani",          name: "மணி",                                       unit: "எண்.",   hasQuantity: true,  defaultQty: "1",  defaultNote: "" },
                    { id: "thupakkal",     name: "தூபக்கால்",                                 unit: "செட்",   hasQuantity: true,  defaultQty: "1",  defaultNote: "" },
                    { id: "panchapaathiram", name: "பஞ்ச பாத்திரம் / உத்தரணி",             unit: "எண்.",   hasQuantity: true,  defaultQty: "1",  defaultNote: "" },
                    { id: "kalyanmanai",   name: "கல்யாண மணை",                               unit: "எண்.",   hasQuantity: true,  defaultQty: "1",  defaultNote: "" },
                    { id: "aiyarmanai",    name: "ஐயர் மணை",                                 unit: "எண்.",   hasQuantity: true,  defaultQty: "15", defaultNote: "" },
                    { id: "sengal",        name: "செங்கல்",                                   unit: "பாண்டு", hasQuantity: true,  defaultQty: "1",  defaultNote: "" },
                    { id: "manal",         name: "மணல்",                                      unit: "—",      hasQuantity: false, defaultQty: "",   defaultNote: "" },
                    { id: "kolamavu",      name: "கோல மாவு",                                  unit: "எண்.",   hasQuantity: true,  defaultQty: "4",  defaultNote: "" },
                    { id: "pazhayaseithi", name: "பழய செய்தி தாள்",                          unit: "எண்.",   hasQuantity: true,  defaultQty: "1",  defaultNote: "" },
                    { id: "kalasasombu",   name: "கலச சொம்பு",                               unit: "எண்.",   hasQuantity: true,  defaultQty: "1",  defaultNote: "" },
                ]
            }
        };
        // ═══════════════════════════════════════════════════════════════

        const eventSelect = document.getElementById('event-select');
        const detailsSection = document.getElementById('details-section');
        const typeSection = document.getElementById('type-section');
        const objectsSection = document.getElementById('objects-section');
        const objectsList = document.getElementById('objects-list');
        const generateBtn = document.getElementById('generate-btn');

        eventSelect.addEventListener('change', () => {
            const hasEvent = !!eventSelect.value;
            detailsSection.style.display = hasEvent ? 'block' : 'none';
            typeSection.style.display = hasEvent ? 'block' : 'none';
            if (!hasEvent) {
                objectsSection.style.display = 'none';
                generateBtn.style.display = 'none';
            } else {
                renderObjects();
            }
        });

        function getSelectedType() {
            const radio = document.querySelector('input[name="purchase-type"]:checked');
            return radio ? radio.value : 'both';
        }

        function renderObjects() {
            const eventKey = eventSelect.value;
            if (!eventKey) return;

            const event = DATA[eventKey];
            objectsList.innerHTML = '';

            const type = getSelectedType();
            const contractLabel    = type === 'contract' ? 'வாத்தியார் வாங்க வேண்டியவை'   : 'வாங்க வேண்டியவை';
            const nonContractLabel = type === 'contract' ? 'நடத்துனர் வாங்க வேண்டியவை' : 'கொண்டு வர வேண்டியவை';

            const groups = [
                { key: 'contract',    label: contractLabel,    items: event.contract },
                { key: 'nonContract', label: nonContractLabel, items: event.nonContract }
            ];

            groups.forEach(group => {
                const block = document.createElement('div');
                block.className = 'group-block';
                block.innerHTML = `
                    <div class="group-header" onclick="toggleGroup('${group.key}')">
                        <span class="group-title">${group.label}</span>
                        <span class="group-arrow" id="arrow-${group.key}">▼</span>
                    </div>
                    <div class="group-items" id="group-${group.key}"></div>
                `;
                objectsList.appendChild(block);

                const container = block.querySelector(`#group-${group.key}`);
                group.items.forEach(obj => {
                    const uid = `${group.key}-${obj.id}`;
                    const card = document.createElement('div');
                    card.className = 'object-card';
                    card.innerHTML = `
                        <div class="object-header">
                            <input type="checkbox" id="chk-${uid}" data-id="${uid}" checked onchange="toggleFields(this)">
                            <span class="object-name">${obj.name}${obj.unit && obj.unit !== 'எண்.' && obj.unit !== 'எண்ணிக்கை' ? ` <span class="unit-badge">${obj.unit}</span>` : ''}</span>
                        </div>
                        <div class="object-fields visible" id="fields-${uid}">
                            ${obj.hasQuantity ? `
                            <div class="field-row">
                                <label>அளவு:</label>
                                <input type="number" class="qty-input" id="qty-${uid}" placeholder="0" min="0" step="any" value="${obj.defaultQty || ''}">
                            </div>` : ''}
                            <div class="field-row note-row">
                                <label>குறிப்பு:</label>
                                <input type="text" class="note-input" id="note-${uid}"
                                       placeholder="குறிப்பு சேர்க்கவும்..."
                                       value="${obj.defaultNote || ''}">
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });

            objectsSection.style.display = 'block';
            generateBtn.style.display = 'block';
        }

        function toggleGroup(key) {
            const items = document.getElementById(`group-${key}`);
            const arrow = document.getElementById(`arrow-${key}`);
            items.classList.toggle('collapsed');
            arrow.classList.toggle('collapsed');
        }

        function toggleFields(checkbox) {
            const id = checkbox.dataset.id;
            const fields = document.getElementById(`fields-${id}`);
            fields.classList.toggle('visible', checkbox.checked);
        }

        function collectRows(group) {
            const rows = [];
            group.items.forEach(obj => {
                const uid = `${group.key}-${obj.id}`;
                const checkbox = document.getElementById(`chk-${uid}`);
                if (!checkbox || !checkbox.checked) return;
                const qty = obj.hasQuantity ? (document.getElementById(`qty-${uid}`)?.value || '—') : '—';
                const noUnitSuffix = !obj.unit || obj.unit === 'எண்.' || obj.unit === 'எண்ணிக்கை';
                const qtyDisplay = obj.hasQuantity ? (qty !== '—' ? (noUnitSuffix ? qty : `${qty} ${obj.unit}`) : '—') : '—';
                const note = document.getElementById(`note-${uid}`)?.value || '';
                rows.push({ name: obj.name, qtyDisplay, note });
            });
            return rows;
        }

        function buildPdfHtml(title, dateStr, groupsData, meta) {
            document.getElementById('pdf-title').textContent = title;
            document.getElementById('pdf-date').textContent = dateStr;
            const pdfMeta = document.getElementById('pdf-meta');
            pdfMeta.className = '';
            pdfMeta.innerHTML = '';
            if (meta.name || meta.phone || meta.date) {
                pdfMeta.className = 'pdf-meta';
                if (meta.name)  pdfMeta.innerHTML += `<span>பெயர்: <strong>${meta.name}</strong></span>`;
                if (meta.phone) pdfMeta.innerHTML += `<span>கைபேசி: <strong>${meta.phone}</strong></span>`;
                if (meta.date)  pdfMeta.innerHTML += `<span>தேதி: <strong>${meta.date}</strong></span>`;
            }
            const pdfBody = document.getElementById('pdf-table-body');
            pdfBody.innerHTML = '';
            groupsData.forEach(group => {
                if (group.rows.length === 0) return;
                const heading = document.createElement('div');
                heading.className = 'pdf-group-title';
                heading.textContent = group.label;
                pdfBody.appendChild(heading);
                const table = document.createElement('table');
                table.innerHTML = `<colgroup><col style="width:5%"><col style="width:50%"><col style="width:15%"><col style="width:30%"></colgroup><thead><tr><th>#</th><th>பொருள்</th><th>அளவு</th><th>குறிப்பு</th></tr></thead>`;
                const tbody = document.createElement('tbody');
                group.rows.forEach((r, i) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `<td>${i + 1}</td><td>${r.name}</td><td>${r.qtyDisplay}</td><td>${r.note}</td>`;
                    tbody.appendChild(row);
                });
                table.appendChild(tbody);
                pdfBody.appendChild(table);
            });
        }

        async function captureAndSave(filename) {
            const element = document.getElementById('pdf-content');
            const savedScrollY = window.scrollY;
            element.style.position = 'absolute';
            element.style.left = '0';
            element.style.top = '0';
            element.style.zIndex = '-1';
            window.scrollTo(0, 0);
            try {
                const canvas = await html2canvas(element, {
                    scale: 2,
                    useCORS: true,
                    scrollX: 0,
                    scrollY: 0,
                    windowWidth: element.scrollWidth,
                    windowHeight: 99999
                });
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');
                const pageWidth  = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();
                const margin = 10;
                const imgWidth  = pageWidth  - margin * 2;
                const printableH = pageHeight - margin * 2;
                const pxPerMm   = canvas.width / imgWidth;
                const pageHeightPx = printableH * pxPerMm;
                const totalPages = Math.ceil(canvas.height / pageHeightPx);

                for (let i = 0; i < totalPages; i++) {
                    if (i > 0) doc.addPage();
                    const sliceY = i * pageHeightPx;
                    const sliceH = Math.min(pageHeightPx, canvas.height - sliceY);
                    const slice  = document.createElement('canvas');
                    slice.width  = canvas.width;
                    slice.height = sliceH;
                    slice.getContext('2d').drawImage(canvas, 0, sliceY, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
                    doc.addImage(slice.toDataURL('image/png'), 'PNG', margin, margin, imgWidth, sliceH / pxPerMm);
                }
                doc.save(filename);
            } finally {
                window.scrollTo(0, savedScrollY);
                element.style.left = '-9999px';
                element.style.position = 'absolute';
                element.style.top = '0';
                element.style.zIndex = '';
            }
        }

        async function generatePDF() {
            const eventKey = eventSelect.value;
            if (!eventKey) return;

            const event = DATA[eventKey];
            const type  = getSelectedType();
            const dateStr = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
            const meta = {
                name:  document.getElementById('input-name').value.trim(),
                phone: document.getElementById('input-phone').value.trim(),
                date:  (() => { const v = document.getElementById('input-date').value; if (!v) return ''; const [y,m,d] = v.split('-'); return `${d}/${m}/${y}`; })()
            };
            const rawDate = document.getElementById('input-date').value || '';
            const fileDate = rawDate.replace(/-/g, '');
            const fileName = meta.name.replace(/\s+/g, '-') || 'unknown';
            const makeFilename = (eventName, suffix) => `${eventName}_${fileDate}_${fileName}${suffix ? '_' + suffix : ''}.pdf`;

            const contractLabel    = type === 'contract' ? 'வாத்தியார் வாங்க வேண்டியவை'   : 'வாங்க வேண்டியவை';
            const nonContractLabel = type === 'contract' ? 'நடத்துனர் வாங்க வேண்டியவை' : 'கொண்டு வர வேண்டியவை';

            const contractGroup    = { key: 'contract',    label: contractLabel,    items: event.contract };
            const nonContractGroup = { key: 'nonContract', label: nonContractLabel, items: event.nonContract };
            const contractRows    = collectRows(contractGroup);
            const nonContractRows = collectRows(nonContractGroup);

            const relevant = type === 'contract'    ? contractRows
                           : type === 'nonContract' ? nonContractRows
                           : [...contractRows, ...nonContractRows];
            if (relevant.length === 0) {
                alert('Please select at least one item.');
                return;
            }

            generateBtn.disabled = true;
            generateBtn.textContent = '⏳ Generating...';

            try {
                if (type === 'contract') {
                    // ── Two separate PDF files ──
                    if (contractRows.length > 0) {
                        buildPdfHtml(`${event.name}`, dateStr,
                            [{ label: contractGroup.label, rows: contractRows }], meta);
                        await captureAndSave(makeFilename(event.name, 'contract'));
                    }
                    if (nonContractRows.length > 0) {
                        buildPdfHtml(`${event.name}`, dateStr,
                            [{ label: nonContractGroup.label, rows: nonContractRows }], meta);
                        await captureAndSave(makeFilename(event.name, 'non-contract'));
                    }
                } else {
                    // ── Single PDF with group headings ──
                    const groups = [];
                    if (contractRows.length > 0)    groups.push({ label: contractGroup.label,    rows: contractRows });
                    if (nonContractRows.length > 0) groups.push({ label: nonContractGroup.label, rows: nonContractRows });
                    buildPdfHtml(`${event.name} — பூஜை பொருட்கள்`, dateStr, groups, meta);
                    await captureAndSave(makeFilename(event.name, ''));
                }
            } catch (err) {
                alert('PDF generation failed.');
                console.error(err);
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = '📄 PDFஆக தரவு செய்க';
            }
        }
    </script>
