<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Planner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f0eb;
            color: #333;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #8b1a1a;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .section {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            color: #555;
        }
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            appearance: none;
        }
        select:focus { border-color: #8b1a1a; outline: none; }
        .object-card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            background: #fafafa;
        }
        .object-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .object-header input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #8b1a1a;
        }
        .object-name {
            font-weight: 600;
            font-size: 1rem;
            flex: 1;
        }
        .unit-badge {
            background: #f0e6d3;
            color: #8b5e3c;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .object-fields {
            display: none;
            margin-top: 8px;
            padding-left: 30px;
        }
        .object-fields.visible { display: block; }
        .field-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }
        .field-row label {
            font-weight: 500;
            font-size: 0.85rem;
            min-width: 60px;
            margin-bottom: 0;
        }
        .field-row input {
            flex: 1;
            padding: 8px;
            border: 1.5px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .field-row input:focus { border-color: #8b1a1a; outline: none; }
        .note-input {
            width: 100%;
            padding: 8px;
            border: 1.5px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .note-input:focus { border-color: #8b1a1a; outline: none; }
        .btn {
            width: 100%;
            padding: 14px;
            background: #8b1a1a;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:active { background: #6b1414; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .no-items { color: #999; text-align: center; padding: 20px; font-style: italic; }
    </style>
</head>
<body>
    <h1>🪔 Event Planner</h1>

    <div class="section">
        <label for="event-select">Select Event</label>
        <select id="event-select">
            <option value="">— Choose an event —</option>
            <option value="wedding">Wedding</option>
            <option value="engagement">Engagement</option>
        </select>
    </div>

    <div class="section" id="objects-section" style="display:none;">
        <label>Items Required</label>
        <div id="objects-list"></div>
    </div>

    <button class="btn" id="generate-btn" style="display:none;" onclick="generatePDF()">
        📄 Generate PDF
    </button>



    <script>
        const DATA = {
            wedding: {
                name: "Wedding",
                objects: [
                    { id: "manjal", name: "Manjal", unit: "grams", hasQuantity: true },
                    { id: "kumkum", name: "Kumkum", unit: "grams", hasQuantity: true },
                    { id: "coconut", name: "Coconut", unit: "count", hasQuantity: true },
                    { id: "panneer", name: "Panneer", unit: "ml", hasQuantity: true },
                    { id: "banana", name: "Banana", unit: "count", hasQuantity: true }
                ]
            },
            engagement: {
                name: "Engagement",
                objects: [
                    { id: "manjal", name: "Manjal", unit: "grams", hasQuantity: true },
                    { id: "kumkum", name: "Kumkum", unit: "grams", hasQuantity: true },
                    { id: "coconut", name: "Coconut", unit: "count", hasQuantity: true },
                    { id: "vasippu", name: "Vasippu Pathirikai", unit: "—", hasQuantity: false,
                      defaultNote: "To read the pathirikkai from bride and bridegroom side" }
                ]
            }
        };

        const eventSelect = document.getElementById('event-select');
        const objectsSection = document.getElementById('objects-section');
        const objectsList = document.getElementById('objects-list');
        const generateBtn = document.getElementById('generate-btn');

        eventSelect.addEventListener('change', renderObjects);

        function renderObjects() {
            const eventKey = eventSelect.value;
            if (!eventKey) {
                objectsSection.style.display = 'none';
                generateBtn.style.display = 'none';
                return;
            }

            const event = DATA[eventKey];
            objectsList.innerHTML = '';

            event.objects.forEach(obj => {
                const card = document.createElement('div');
                card.className = 'object-card';
                card.innerHTML = `
                    <div class="object-header">
                        <input type="checkbox" id="chk-${obj.id}" data-id="${obj.id}" checked onchange="toggleFields(this)">
                        <span class="object-name">${obj.name}</span>
                        <span class="unit-badge">${obj.unit}</span>
                    </div>
                    <div class="object-fields visible" id="fields-${obj.id}">
                        ${obj.hasQuantity ? `
                        <div class="field-row">
                            <label>Qty:</label>
                            <input type="number" id="qty-${obj.id}" placeholder="Enter ${obj.unit}" min="0" step="any">
                        </div>` : ''}
                        <div class="field-row" style="flex-direction:column; align-items:stretch;">
                            <label>Note:</label>
                            <input type="text" class="note-input" id="note-${obj.id}" 
                                   placeholder="Add a note..." 
                                   value="${obj.defaultNote || ''}">
                        </div>
                    </div>
                `;
                objectsList.appendChild(card);
            });

            objectsSection.style.display = 'block';
            generateBtn.style.display = 'block';
        }

        function toggleFields(checkbox) {
            const id = checkbox.dataset.id;
            const fields = document.getElementById(`fields-${id}`);
            fields.classList.toggle('visible', checkbox.checked);
        }

        function generatePDF() {
            const eventKey = eventSelect.value;
            if (!eventKey) return;

            const event = DATA[eventKey];
            const rows = [];

            event.objects.forEach(obj => {
                const checkbox = document.getElementById(`chk-${obj.id}`);
                if (!checkbox || !checkbox.checked) return;

                const qty = obj.hasQuantity
                    ? (document.getElementById(`qty-${obj.id}`)?.value || '—')
                    : '—';
                const note = document.getElementById(`note-${obj.id}`)?.value || '';

                rows.push([rows.length + 1, obj.name, qty, obj.unit, note]);
            });

            if (rows.length === 0) {
                alert('Please select at least one item.');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Title
            doc.setFontSize(18);
            doc.setTextColor(139, 26, 26);
            doc.text(`${event.name} \u2014 Items List`, 14, 20);

            // Date
            doc.setFontSize(10);
            doc.setTextColor(136, 136, 136);
            doc.text(`Generated on: ${new Date().toLocaleDateString('en-IN', {
                day: 'numeric', month: 'long', year: 'numeric'
            })}`, 14, 28);

            // Table
            doc.autoTable({
                startY: 34,
                head: [['#', 'Item', 'Quantity', 'Unit', 'Note']],
                body: rows,
                headStyles: { fillColor: [139, 26, 26] },
                alternateRowStyles: { fillColor: [250, 247, 244] },
                styles: { fontSize: 10 }
            });

            doc.save(`${event.name.toLowerCase()}-items-list.pdf`);
        }
    </script>
</body>
</html>
